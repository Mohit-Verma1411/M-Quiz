services:
  - type: web
    name: m-quiz
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true